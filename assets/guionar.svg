<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="GuionAR">
  <title>GuionAR</title>
  <!-- Línea activa: lo leído atenuado, la línea actual plena, lo próximo
       intermedio, y la marca de lectura ámbar. Rejilla 64 / módulo 4;
       baldosa y trazo compartidos con ParlAR (barras horizontales vs.
       verticales). -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="#101114"/>
  <rect x="5" y="5" width="54" height="54" rx="13" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="2"/>
  <rect x="24" y="18" width="20" height="6" rx="3" fill="#5C5E64"/>
  <rect x="24" y="28" width="26" height="6" rx="3" fill="#FFFFFF"/>
  <rect x="24" y="38" width="16" height="6" rx="3" fill="#9C9EA4"/>
  <rect x="14" y="26" width="4" height="10" rx="2" fill="#FFC45C"/>
</svg>
