name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Qt necesita estas libs incluso en modo offscreen (sin display real)
      - name: Install Qt runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -u tests/test_guionar.py
          python -u tests/test_guion.py
          python -u tests/test_phase1.py
          python -u tests/test_phase2.py
          python -u tests/test_phase3.py
          python -u tests/test_phase4.py
          python -u tests/test_phase5.py
          python -u tests/test_documents.py
          python -u tests/test_product.py
          python -u tests/test_desktop.py
          python -u tests/test_audit.py
          python -u tests/test_pin.py
          python -u tests/test_integration.py
          python -u tests/test_voice_viewport.py
          python -u tests/test_partial_follow.py
          python -u tests/test_visual_polish.py
          python -u tests/test_brand_assets.py
          python -u tests/test_live_transcript.py
          python -u tests/test_release.py
