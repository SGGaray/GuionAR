name: release

# Sólo manual en esta etapa: construye y valida la release y la sube como
# artifact de Actions. No crea tags ni publica una GitHub Release.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Qt necesita estas libs incluso en modo offscreen (sin display real)
      - name: Install Qt runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install pinned Python dependencies
        run: pip install -c constraints.txt -r requirements.txt

      - name: Run all suites
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          for suite in tests/test_*.py; do
            echo "==> $suite"
            python -u "$suite"
          done

  build:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Build release twice and require identical bytes
        run: |
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          python scripts/build_release.py --out dist/release
          python scripts/build_release.py --out "$RUNNER_TEMP/again"
          for archivo in dist/release/*; do
            cmp "$archivo" "$RUNNER_TEMP/again/$(basename "$archivo")"
          done
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

      - uses: actions/upload-artifact@v4
        with:
          name: guionar-release
          path: dist/release/
          if-no-files-found: error

  checksum:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: guionar-release
          path: release

      - name: Verify SHA256SUMS
        working-directory: release
        run: |
          sha256sum -c SHA256SUMS
          tar -tzf guionar-*-linux.tar.gz

  fresh-install-smoke:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Qt runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            desktop-file-utils

      - uses: actions/download-artifact@v4
        with:
          name: guionar-release
          path: ${{ runner.temp }}/release

      - name: Isolated install, update, rollback, uninstall and legacy launcher
        run: |
          ./scripts/test_release_install.sh "$RUNNER_TEMP/release" \
            --python "$(command -v python)"
